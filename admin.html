<!DOCTYPE html>
<html>

<head>

<title>Admin Dashboard</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
font-family:Arial;
background:#f4f4f4;
text-align:center;
}

table{
width:90%;
margin:auto;
border-collapse:collapse;
background:white;
}

th,td{
padding:10px;
border:1px solid #ccc;
}

th{
background:#333;
color:white;
}

#map{
height:400px;
width:90%;
margin:20px auto;
}

button{
padding:6px 10px;
cursor:pointer;
}

</style>

</head>

<body>

<h1>Admin Dashboard</h1>

<table>

<thead>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Service</th>
<th>Location</th>
<th>Status</th>
<th>Map</th>
</tr>
</thead>

<tbody id="requestTable"></tbody>

</table>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map = L.map('map').setView([11.0168,76.9558],10)

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{

maxZoom:19

}).addTo(map)



function loadRequests(){

fetch("http://localhost:5000/requests")

.then(res=>res.json())

.then(data=>{

let table=""

data.forEach(r=>{

table+=`
<tr>
<td>${r.name}</td>
<td>${r.phone}</td>
<td>${r.service}</td>
<td>${r.location}</td>
<td>${r.status}</td>
<td>
<button onclick="showLocation('${r.location}')">View Map</button>
</td>
</tr>
`

})

document.getElementById("requestTable").innerHTML=table

})

}



function showLocation(location){

let coords = location.split(",")

let lat = parseFloat(coords[0])
let lon = parseFloat(coords[1])

map.setView([lat,lon],13)

L.marker([lat,lon]).addTo(map)

}



loadRequests()

</script>

</body>
</html>
