<!DOCTYPE html>
<html>

<head>
<title>Request Service</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="form">

<h2>Request Breakdown Service</h2>

<select id="service">

<option>Bike Repair</option>
<option>Car Towing</option>
<option>Battery Jumpstart</option>
<option>Fuel Delivery</option>

</select>

<input type="text" id="location" placeholder="Enter Location">

<button onclick="sendRequest()">Request Service</button>

</div>

<script>
function sendRequest(){

let service = document.getElementById("service").value
let location = document.getElementById("location").value

if(location === ""){
alert("Please enter location")
return
}

alert("Service Requested!\nService: " + service + "\nLocation: " + location)

}
</script>
</body>
</html>
