<!DOCTYPE html>
<html>

<head>
<title>Mechanic Panel</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
text-align:center;
}

h1{
margin-top:20px;
}

table{
width:90%;
margin:auto;
border-collapse:collapse;
background:white;
box-shadow:0 0 10px gray;
}

th,td{
padding:12px;
border:1px solid #ccc;
}

th{
background:#222;
color:white;
}

button{
padding:6px 10px;
margin:3px;
cursor:pointer;
}

.pending{
background:orange;
color:white;
border:none;
}

.ontheway{
background:blue;
color:white;
border:none;
}

.complete{
background:green;
color:white;
border:none;
}

</style>

</head>

<body>

<h1>Mechanic Service Panel</h1>

<table>

<thead>

<tr>
<th>ID</th>
<th>Name</th>
<th>Phone</th>
<th>Service</th>
<th>Location</th>
<th>Status</th>
<th>Update</th>
</tr>

</thead>

<tbody id="requestTable">

</tbody>

</table>

<script>

function loadRequests(){

fetch("http://localhost:5000/requests")

.then(res=>res.json())

.then(data=>{

let table=""

data.forEach(r=>{

table+=`
<tr>
<td>${r.id}</td>
<td>${r.name}</td>
<td>${r.phone}</td>
<td>${r.service}</td>
<td>${r.location}</td>
<td>${r.status}</td>

<td>

<button class="pending" onclick="updateStatus(${r.id},'Pending')">Pending</button>

<button class="ontheway" onclick="updateStatus(${r.id},'On The Way')">On The Way</button>

<button class="complete" onclick="updateStatus(${r.id},'Completed')">Completed</button>

</td>

</tr>
`

})

document.getElementById("requestTable").innerHTML=table

})

}



function updateStatus(id,status){

fetch("http://localhost:5000/update-status",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({id,status})

})

.then(res=>res.text())

.then(data=>{

alert(data)

loadRequests()

})

}


loadRequests()

</script>

</body>

</html>
